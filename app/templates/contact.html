{% extends "base.html" %}

{% block title %}Anirudh S — Contact{% endblock %}

{% block content %}
<section class="contact-container">

  <div class="featured__header anim anim-1" style="flex-direction: column; align-items: flex-start; gap: 12px; margin-bottom: 40px;">
    <span class="label">Get In Touch</span>
    <h1 class="section-title" style="font-size: clamp(34px, 5.5vw, 52px);">
      Let's build something <span class="accent">together.</span>
    </h1>
    <p style="color: var(--text-muted); max-width: 480px; font-size: 14.5px; font-family: var(--font-body); line-height: 1.8;">
      Have a role, a project, or just want to talk about RAG pipelines and backend systems? Drop me a line below.
    </p>
  </div>

  <form action="/contact" method="POST" class="contact-form anim anim-2">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="John Doe" required>
    </div>

    <div class="form-group">
      <label for="email">Your Email</label>
      <input type="email" id="email" name="email" placeholder="john@example.com" required>
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" placeholder="Hey Anirudh, let's connect..." required></textarea>
    </div>

    <button type="submit" class="btn-submit">Send Message</button>
  </form>

</section>
{% endblock content %}
